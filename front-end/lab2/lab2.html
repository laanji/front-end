<!DOCTYPE html>
<html lang="uk">    
    <head>
        <meta charset="UTF-8">
        <meta name="keywords" content="Таблиці HTML5, CSS трансформації, позиціонування, КПІ, ФІОТ">
        <meta name="description" content="Основи Front-end технологій. Лабораторна робота №2">
        <title>Друченко О.С. ІК-41 ЛР-2 Вар-10</title>
        <link rel="stylesheet" href="style.css">
        <style>
            .task-table {
                border-collapse: collapse;
                width: 100%;
                max-width: 800px;
                margin: 20px 0 40px 0;
                font-family: Arial, sans-serif;
                text-align: center;
            }

            .task-table td {
                border: 2px solid #222;
                padding: 14px;
                font-weight: bold;
                transition: background-color 0.3s ease, color 0.3s ease;
            }

            .task-table tr:nth-child(1) td {
                background-color: #108f8f;
                color: #ffffff;
            }

            .task-table tr:nth-child(2) td {
                background-color: #f5f510;
                color: #111111;
            }

            .task-table tr:nth-child(1):hover td {
                background-color: #f5f510;
                color: #111111;
            }

            .task-table tr:nth-child(2):hover td {
                background-color: #108f8f;
                color: #ffffff;
            }

            .task-table tr:nth-child(3) td {
                background-color: #fafafa;
                color: #333333;
            }
        </style>
    </head>
    <body>
        <h2>Завдання 1. Таблиця (Варіант №10)</h2>
        <table class="task-table">
            <tr>
                <td>Друченко</td>
                <td>Олексій</td>
                <td rowspan="2">Сергійович</td>
                <td>ФІОТ</td>
                <td rowspan="2">126 ІСТ</td>
            </tr>
            <tr>
                <td colspan="2">Група ІК-41</td>
                <td>ЛР №2</td>
            </tr>
            <tr>
                <td colspan="2">КПІ ім. Ігоря Сікорського</td>
                <td colspan="3">2026 навчальний рік (Варіант 10)</td>
            </tr>
        </table>

        <hr>

        <h2>Завдання 2. Створення зображення (Варіант 10: Шестірня)</h2>
        
        <div class="targets-wrapper">
            <div class="target-card">
                <h3>1. Спосіб (position)</h3>
                <div class="gear-pos">
                    <div class="tooth t0"></div>
                    <div class="tooth t45"></div>
                    <div class="tooth t90"></div>
                    <div class="tooth t135"></div>
                    <div class="gear-body"></div>
                    <div class="gear-hole"></div>
                </div>
            </div>

            <div class="target-card">
                <h3>2. Спосіб (transform)</h3>
                <div class="gear-tf">
                    <div class="t-tooth"></div>
                    <div class="t-tooth rot-45"></div>
                    <div class="t-tooth rot-90"></div>
                    <div class="t-tooth rot-135"></div>
                    <div class="t-body"></div>
                    <div class="t-hole"></div>
                </div>
            </div>
        </div>
    </body>
</html>
